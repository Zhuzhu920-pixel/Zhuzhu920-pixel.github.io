<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>祝潇灵的 AI 作品展</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="exhibit-page">
    <div class="scene-wrap" id="scene">
      <img class="scene-image" src="assets/studio-exhibit-v5.png" alt="祝潇灵的 AI 作品展板" />
      <div class="scene-shade"></div>
      <div class="scene-title"><span>PERSONAL STUDIO / 2026</span><strong>祝潇灵的<br /><i>AI 作品展</i></strong><small>点击桌面上的东西，慢慢认识我。</small></div>
      <div class="scene-tip">HOVER / CLICK TO EXPLORE</div>
      <button class="hotspot h-about" data-piece="identity" aria-label="打开个人介绍"><span>关于我</span></button>
      <button class="hotspot h-manual" data-piece="manual" aria-label="打开个人说明书"><span>个人说明书</span></button>
      <button class="hotspot h-team" data-piece="team" aria-label="打开小组共创会"><span>小组共创</span></button>
      <button class="hotspot h-research" data-piece="research" aria-label="打开用户调研"><span>用户调研</span></button>
      <button class="hotspot h-xhs" data-piece="xiaohongshu" aria-label="打开小红书图文"><span>小红书图文</span></button>
      <button class="hotspot h-website" data-piece="website" aria-label="打开行动合伙人体验网站"><span>行动合伙人网站</span></button>
      <button class="hotspot h-interview" data-piece="interview" aria-label="打开面试官 PPT"><span>面试官 PPT</span></button>
      <button class="hotspot h-skill" data-piece="skill" aria-label="打开岗位分析 Skill"><span>岗位 Skill</span></button>
      <button class="hotspot h-notebook" data-piece="reflection" aria-label="打开复盘笔记"><span>复盘笔记</span></button>
      <button class="hotspot h-phone" data-piece="contact" aria-label="打开联系方式"><span>给我留个消息</span></button>
      <button class="hotspot h-fish" data-piece="fish" aria-label="点击鱼缸"><span>小鱼小鱼快快游</span></button>
    </div>
    <section class="mobile-exhibit-menu" aria-label="移动端展品目录">
      <div class="mobile-menu-heading">
        <span>EXHIBIT INDEX</span>
        <h2>展板上的东西，<br />在这里也能慢慢看。</h2>
        <p>点开一件展品，听它讲讲自己的故事。</p>
      </div>
      <div class="mobile-piece-grid">
        <button class="mobile-piece piece-manual" data-piece="manual"><b>01</b><span>个人说明书</span><small>第一次遇见 AI</small></button>
        <button class="mobile-piece piece-team" data-piece="team"><b>02</b><span>小组共创会</span><small>一场剧本杀</small></button>
        <button class="mobile-piece piece-research" data-piece="research"><b>03</b><span>用户调研</span><small>重新理解大一</small></button>
        <button class="mobile-piece piece-content" data-piece="xiaohongshu"><b>04</b><span>小红书图文</span><small>内容要有重点</small></button>
        <button class="mobile-piece piece-website" data-piece="website"><b>05</b><span>行动合伙人网站</span><small>一次游戏化体验</small></button>
        <button class="mobile-piece piece-interview" data-piece="interview"><b>06</b><span>面试官 PPT</span><small>别停在第一印象</small></button>
        <button class="mobile-piece piece-skill" data-piece="skill"><b>07</b><span>岗位分析 Skill</span><small>会追问的简历助手</small></button>
        <button class="mobile-piece piece-reflection" data-piece="reflection"><b>08</b><span>复盘笔记</span><small>做完再想一想</small></button>
        <button class="mobile-piece piece-contact" data-piece="contact"><b>09</b><span>给我留个消息</span><small>如果你想继续了解我</small></button>
        <button class="mobile-piece piece-fish" data-piece="fish"><b>10</b><span>小鱼小鱼快快游</span><small>今天也有在往前游</small></button>
      </div>
    </section>
  </main>
  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <div class="modal-scene" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeBtn" aria-label="关闭">×</button>
      <article class="modal-paper">
        <div class="paper-top">
          <div class="modal-mark" id="modalMark">01</div>
          <div class="modal-kicker" id="modalKicker"></div>
        </div>
        <h1 id="modalTitle"></h1>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </article>
    </div>
  </div>
  <div class="toast" id="toast">今天也有在往前游。</div>
  <script src="script.js"></script>
</body>
</html>
